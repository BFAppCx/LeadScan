name: Publish container images

on:
  push:
    branches:
      - live
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/bfappcx/leadscan-app
  OCR_IMAGE: ghcr.io/bfappcx/leadscan-ocr-worker

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=live
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - name: Extract OCR image metadata
        id: ocr-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OCR_IMAGE }}
          tags: |
            type=raw,value=live
            type=sha,prefix=sha-

      - name: Build and push OCR image
        uses: docker/build-push-action@v6
        with:
          context: ./services/ocr-worker
          file: ./services/ocr-worker/Dockerfile
          push: true
          tags: ${{ steps.ocr-meta.outputs.tags }}
          labels: ${{ steps.ocr-meta.outputs.labels }}
